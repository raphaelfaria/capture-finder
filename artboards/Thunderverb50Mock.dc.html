<script>
'use strict';
const def = JSON.parse(document.getElementById('panel-data').textContent);
const as = JSON.parse(JSON.stringify(def.defaults));
function f1(v){ return (Math.round(v*10)/10).toFixed(1); }
function nice(l){ return l && l === l.toUpperCase() ? l.toLowerCase().replace(/(^|\s)\w/g, m => m.toUpperCase()) : l; }
function chName(def, n){ const c = (def.channels || []).find(x => x.n === n); return c ? c.name : ''; }
function available(c, n){ return !c.channels || (n != null && c.channels.includes(n)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function jattr(v){ return esc(JSON.stringify(v)); }
function snap(c, v){ return Math.min(c.max, Math.max(c.min, Math.round(v / c.step) * c.step)); }
function chAttr(n){ return n == null ? '' : String(n); }
function tip(pos){ return { pos }; }
function posFor(idx, count){ return idx === 0 ? 'up' : idx === count - 1 ? 'down' : 'mid'; }
function leverSVG(pos, horizontal){

  const W = horizontal ? 32 : 22, H = horizontal ? 20 : 32;
  const slot = horizontal ? 'x="3" y="4" width="26" height="12" rx="6"' : 'x="5" y="3" width="12" height="26" rx="6"';
  const cx = horizontal ? [9, 16, 23][at] : 11, cy = horizontal ? 10 : [9, 16, 23][at];

  const shaft = at === 1 ? '' : '<path d="M'+(W/2)+' '+(H/2)+' L'+cx+' '+cy+'" stroke="#3c3c3c" stroke-width="3" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><rect '+slot+' fill="#070707" stroke="#6e6e6e" stroke-width="1.2"/>'
    + shaft+'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#e2e2e2" stroke="#7a7a7a" stroke-width="1"/><circle cx="'+(cx - 1)+'" cy="'+(cy - 1)+'" r="1.4" fill="#fafafa"/></svg>';

function targetAttrs(t){ return t.channel ? 'data-target="channel"' : 'data-target="ctrl" data-key="'+t.key+'" data-ch="'+chAttr(t.ch)+'"'; }

function jpToggle(x, y, options, current, target, aria, labelPos, title, titleY){
  const idx = Math.max(0, options.findIndex(o => o.v === current));

  options.forEach((o, i) => {
    h += '<button id="t-'+targetId(target)+'-'+i+'" class="tlbl pos" style="left:'+labelPos[i].x+'px;top:'+labelPos[i].y+'px" aria-pressed="'+(o.v === current)+'"'
      + ' aria-label="'+esc(aria+': '+o.label)+'" data-act="pick" '+targetAttrs(target)+' data-v="'+jattr(o.v)+'">'+esc(o.label)+'</button>';
  });
  if (title) h += '<span class="silk pos" style="left:'+x+'px;top:'+titleY+'px">'+esc(title)+'</span>';
  return h;
}
function faderInput(c, n, value, prefix){
  return '<input id="f-'+c.key+'-'+chAttr(n)+'" class="sr fader-in" type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+value+'"'
    + ' aria-label="'+esc(prefix+c.label)+'" aria-valuetext="'+f1(value)+' of '+c.max+(value === (c.min + c.max)/2 ? ', center' : '')+'"'
    + ' data-ctrl="'+c.key+'" data-ch="'+chAttr(n)+'">';
}
// Orange Thunderverb 50: the white faceplate inside the orange tolex (standby, the jewel light, the input,
// the logo and the crest are left out; the name stays as plain text). Under the name, the black strip with
// the CHANNEL A / CHANNEL B bars, the orange strip with Orange's pictograms and the labels, then the
// knobs: ATTENUATOR · REVERB, channel A (VOLUME · TREBLE · MIDDLE · BASS · GAIN), channel B (VOLUME ·
// SHAPE · GAIN), big and small black ribbed knobs as on the amp. The CHANNEL switch picks the channel;
// the controls the selected channel doesn't use are dimmed. Reverb isn't recorded (shown, not matched).
const TV_KNOBS = [['attenuator', 124, 1], ['reverb', 180, 1], ['volumea', 236, 1], ['treble', 284, 0], ['middle', 326, 0], ['bass', 368, 0], ['gaina', 418, 1], ['volumeb', 474, 1], ['shape', 522, 0], ['gainb', 570, 1]];
const TV_ICON = {
  channel:'<path d="M1 11V5h4v6h4V5h3"/><path d="M13 8q2-5 4 0t4 0"/>',
  attenuator:'<path d="M2 6h3l4-4v12l-4-4H2z"/><path d="M15 3v9M12 9l3 3 3-3"/>',
  reverb:'<circle cx="4" cy="8" r="2.6"/><circle cx="9" cy="8" r="2.6"/><circle cx="14" cy="8" r="2.6"/><circle cx="19" cy="8" r="2.6"/>',
  volume:'<path d="M2 6h3l4-4v12l-4-4H2z"/><path d="M12 4q4 4 0 8M15 2q6 6 0 12"/>',
  treble:'<path d="M5 14V2q5 1 1 6q-4 3 0 5"/><path d="M15 13V4M12 7l3-3 3 3"/>',
  middle:'<path d="M1 8h6M5 5l3 3-3 3"/><circle cx="11" cy="8" r="1.6"/><path d="M21 8h-6M17 5l-3 3 3 3"/>',
  bass:'<path d="M3 13q7-2 5-8q-3-3-5 0"/><circle cx="10" cy="5" r=".8"/><circle cx="10" cy="9" r=".8"/><path d="M16 3v9M13 9l3 3 3-3"/>',
  gain:'<path d="M1 12l4-6 3 4 4-7 3 6 4-5"/>',

function tvKnobHTML(def, as, c, x, big){
  const v = as.global[c.key], off = tvOff(c, as), k = big ? 46 : 34, r = k/2, angle = (-150 + (v - c.min)/(c.max - c.min)*300).toFixed(1);

    + ' aria-label="'+esc(aria)+'" aria-valuetext="'+f1(v)+' of '+c.max+'" data-ctrl="'+c.key+'" data-ch="">'
    + '<span class="kwrap" style="width:'+k+'px;height:'+k+'px" data-drag="knob" data-ctrl="'+c.key+'" data-ch=""><svg viewBox="0 0 '+k+' '+k+'" width="'+k+'" height="'+k+'" aria-hidden="true"><g transform="rotate('+angle+' '+r+' '+r+')">'
    + '<circle cx="'+r+'" cy="'+r+'" r="'+(r - 1)+'" fill="#111" stroke="#3a3a3a" stroke-width="1"/><g stroke="#2c2c2c" stroke-width="2">'+ribs+'</g>'

function thunderverbPanelHTML(def, as){
  const C = (k) => def.controls.find(c => c.key === k);
  let h = '<div class="tvface" role="group" aria-label="'+esc(def.brand+' '+def.model+' front panel')+'">';
  h += '<span class="tvname" aria-hidden="true">ORANGE<span>THUNDERVERB 50</span></span>';
  h += '<span class="tvblack" aria-hidden="true"></span><span class="tvbar" style="left:210px;width:236px">CHANNEL A</span><span class="tvbar" style="left:452px;width:144px">CHANNEL B</span>';
  h += '<span class="tvorange" aria-hidden="true"></span>'+tvIcon('channel', 49);
  TV_KNOBS.forEach(([k, x]) => { const ic = k === 'volumea' || k === 'volumeb' ? 'volume' : k === 'gaina' || k === 'gainb' ? 'gain' : k; h += tvIcon(ic, x - 11); });

  return h + '</div>';
}

const C = (k) => def.controls.find(c => c.key === k);
function set(key, v){ if (key === '@channel') as.channel = v; else as.global[key] = v; draw(); }
function draw(){
  const f = document.activeElement && document.activeElement.id;
  document.getElementById('panel').innerHTML = '<div class="cab tvcab">'+thunderverbPanelHTML(def, as)+'</div>';
  if (f && document.getElementById(f)) document.getElementById(f).focus({preventScroll:true});
}

  else if (t.dataset.act === 'pick') set(t.dataset.key, JSON.parse(t.dataset.v));
  else if (t.dataset.act === 'cycle' && t.dataset.target === 'channel') { const ns = def.channels.map(c => c.n); set('@channel', ns[(ns.indexOf(as.channel) + 1) % ns.length]); }
  else if (t.dataset.act === 'cycle') { const c = C(t.dataset.key), i = c.options.findIndex(o => o.v === as.global[c.key]); set(c.key, c.options[(i + 1) % c.options.length].v); }
});
document.addEventListener('input', e => { const t = e.target; if (t.matches('input[type=range][data-ctrl]')) set(t.dataset.ctrl, snap(C(t.dataset.ctrl), parseFloat(t.value))); });
let drag = null;
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-drag]'); if (!t) return; e.preventDefault(); drag = {c:C(t.dataset.ctrl), y:e.clientY, v:as.global[t.dataset.ctrl]}; });

draw();
