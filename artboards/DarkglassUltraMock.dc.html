<script>
'use strict';
const def = JSON.parse(document.getElementById('panel-data').textContent);

function f1(v){ return (Math.round(v*10)/10).toFixed(1); }
function nice(l){ return l && l === l.toUpperCase() ? l.toLowerCase().replace(/(^|\s)\w/g, m => m.toUpperCase()) : l; }
function chName(def, n){ const c = (def.channels || []).find(x => x.n === n); return c ? c.name : ''; }
function available(c, n){ return !c.channels || (n != null && c.channels.includes(n)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

function snap(c, v){ return Math.min(c.max, Math.max(c.min, Math.round(v / c.step) * c.step)); }
function chAttr(n){ return n == null ? '' : String(n); }
function tip(pos){ return { pos }; }
function posFor(idx, count){ return idx === 0 ? 'up' : idx === count - 1 ? 'down' : 'mid'; }

  const slot = horizontal ? 'x="3" y="4" width="26" height="12" rx="6"' : 'x="5" y="3" width="12" height="26" rx="6"';
  const cx = horizontal ? [9, 16, 23][at] : 11, cy = horizontal ? 10 : [9, 16, 23][at];

  const shaft = at === 1 ? '' : '<path d="M'+(W/2)+' '+(H/2)+' L'+cx+' '+cy+'" stroke="#3c3c3c" stroke-width="3" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><rect '+slot+' fill="#070707" stroke="#6e6e6e" stroke-width="1.2"/>'
    + shaft+'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#e2e2e2" stroke="#7a7a7a" stroke-width="1"/><circle cx="'+(cx - 1)+'" cy="'+(cy - 1)+'" r="1.4" fill="#fafafa"/></svg>';

// Darkglass Microtubes B7K Ultra (the Neural DSP Darkglass Ultra / Ultimate plugins' pedal):
// the black faceplate with MASTER · BLEND | LEVEL · DRIVE over BASS · LO MIDS | HI MIDS · TREBLE,
// the ATTACK / LO MIDS and GRUNT / HI MIDS 3-way toggles between each knob pair (mid toggles
// labelled with the frequencies printed on the pedal, in its order), and the recorded DISTORTION
// footswitch. Bypass, LEDs, jacks and the enclosure are cropped away.

function bgKnobHTML(c, v, x, plate, led, as){

    + '<path d="M22 5 L22 17" stroke="#2a2a2a" stroke-width="1.6" stroke-linecap="round"/></g></svg></span></label><span class="ro" aria-hidden="true">'+f1(v)+'</span></div>'

// Mini toggles are horizontal on this amp: the lever leans to the chosen position, the printed

function bgToggleHTML(c, v, x, title, letters, dy){
  const n = c.options.length, idx = Math.max(0, c.options.findIndex(o => o.v === v)), y = dy || 0;
  let h = '<span class="bgtitle" style="left:'+x+'px;top:'+(4 + y)+'px">'+esc(title)+'</span>'
    + '<button class="bgtgl" style="left:'+x+'px;top:'+(15 + y)+'px" tabindex="-1" aria-hidden="true" data-act="cycle" data-target="ctrl" data-key="'+c.key+'" data-ch="">'
    + togHSVG(posFor(idx, n))+'</button>';
  c.options.forEach((o, i) => {
    const lx = x + (n === 2 ? (i ? 9 : -9) : (i - 1)*12);
    h += '<button id="t-'+c.key+'--'+i+'" class="bglet" style="left:'+lx+'px;top:'+(37 + y)+'px" aria-pressed="'+(o.v === v)+'" aria-label="'+esc(nice(title)+': '+o.label)+'"'
      + ' data-act="pick" data-target="ctrl" data-key="'+c.key+'" data-ch="" data-v="'+jattr(o.v)+'">'+esc(letters[i])+'</button>';
  });
  return h;
}
function ecstasyPanelHTML(def, as){
  const g = as.global, C = (k) => def.controls.find(c => c.key === k);
  let h = '<div class="bgface" role="group" aria-label="Bogner Ecstasy 100B front panel">';
  BG_SECTIONS.forEach(sec => {
    h += '<div class="bgsec" style="width:'+sec.w+'px">';
    if (sec.badge) h += '<span class="bgbadge" aria-hidden="true">ECSTASY<span>BY</span>BOGNER</span>';
    sec.toggles.forEach(([k, x, title, letters, dy]) => { h += bgToggleHTML(C(k), g[k], x, title, letters, dy); });
    sec.knobs.forEach(([k, x, plate, led]) => { h += bgKnobHTML(C(k), g[k], x, plate, led, as); });
    if (sec.rear) h += '<span class="bgrear">REAR PANEL</span>';
    h += '</div>';
  });
  return h + '</div>';
}

const C = (k) => def.controls.find(c => c.key === k);
function set(key, v){ if (key === '@channel') as.channel = v; else as.global[key] = v; draw(); }
function draw(){
  const f = document.activeElement && document.activeElement.id;
  document.getElementById('panel').innerHTML = '<div class="cab b7cab">'+b7UltraPanelHTML(def, as)+'</div>';
  if (f && document.getElementById(f)) document.getElementById(f).focus({preventScroll:true});
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'channel') set('@channel', Number(t.dataset.n));
  else if (t.dataset.act === 'pick') set(t.dataset.key, JSON.parse(t.dataset.v));
  else if (t.dataset.act === 'cycle' && t.dataset.target === 'channel') { const ns = def.channels.map(c => c.n); set('@channel', ns[(ns.indexOf(as.channel) + 1) % ns.length]); }
  else if (t.dataset.act === 'cycle') { const c = C(t.dataset.key), i = c.options.findIndex(o => o.v === as.global[c.key]); set(c.key, c.options[(i + 1) % c.options.length].v); }
});
document.addEventListener('input', e => { const t = e.target; if (t.matches('input[type=range][data-ctrl]')) set(t.dataset.ctrl, snap(C(t.dataset.ctrl), parseFloat(t.value))); });
let drag = null;
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-drag]'); if (!t) return; e.preventDefault(); drag = {c:C(t.dataset.ctrl), y:e.clientY, v:as.global[t.dataset.ctrl]}; });
window.addEventListener('pointermove', e => { if (!drag) return; const c = drag.c, nv = snap(c, drag.v + (drag.y - e.clientY)/14 * (c.max - c.min)/10); if (nv !== as.global[c.key]) set(c.key, nv); });
window.addEventListener('pointerup', () => { drag = null; });
draw();
</script>
</body>
