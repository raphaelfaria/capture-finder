<body>
<div class="board"><div id="panel"></div><p class="cap">Xotic Effects BB Preamp — panel mock. Visual reference only — nothing here controls a physical amp.</p></div>
<script type="application/json" id="panel-data">{"id":"xotic-effects-bb-preamp","brand":"Xotic Effects","model":"BB Preamp","panel":"bbpreamp","category":"Pedals","fullName":"BB Preamp · overdrive / preamp pedal","definitionSource":"pedal photo + capture settings","channels":null,"controls":[{"key":"gain","label":"GAIN","aliases":["Gain"],"kind":"knob","scope":"global","min":0,"max":10,"step":0.1,"weight":2.5,"primary":true},{"key":"treble","label":"TREBLE","aliases":["Treble"],"kind":"knob","scope":"global","min":0,"max":10,"step":0.1,"weight":1},{"key":"volume","label":"VOLUME","aliases":["Volume"],"kind":"knob","scope":"global","min":0,"max":10,"step":0.1,"weight":0.8},{"key":"bass","label":"BASS","aliases":["Bass"],"kind":"knob","scope":"global","min":0,"max":10,"step":0.1,"weight":1}],"panelOrder":["gain","treble","volume","bass"],"defaults":{"channel":null,"ch":{},"global":{"gain":0,"treble":5,"volume":6,"bass":5}},"defaultsNote":"The status LED, bypass footswitch, jacks and the lower body of the pedal are left out."}</script>
<script>
'use strict';
const def = JSON.parse(document.getElementById('panel-data').textContent);
const as = JSON.parse(JSON.stringify(def.defaults));
function f1(v){ return (Math.round(v*10)/10).toFixed(1); }
function nice(l){ return l && l === l.toUpperCase() ? l.toLowerCase().replace(/(^|\s)\w/g, m => m.toUpperCase()) : l; }
function chName(def, n){ const c = (def.channels || []).find(x => x.n === n); return c ? c.name : ''; }
function available(c, n){ return !c.channels || (n != null && c.channels.includes(n)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function jattr(v){ return esc(JSON.stringify(v)); }
function snap(c, v){ return Math.min(c.max, Math.max(c.min, Math.round(v / c.step) * c.step)); }
function chAttr(n){ return n == null ? '' : String(n); }
function tip(pos){ return { pos }; }
function posFor(idx, count){ return idx === 0 ? 'up' : idx === count - 1 ? 'down' : 'mid'; }
function leverSVG(pos, horizontal){
  const at = pos === 'up' ? 0 : pos === 'down' ? 2 : 1;
  const W = horizontal ? 32 : 22, H = horizontal ? 20 : 32;
  const slot = horizontal ? 'x="3" y="4" width="26" height="12" rx="6"' : 'x="5" y="3" width="12" height="26" rx="6"';
  const cx = horizontal ? [9, 16, 23][at] : 11, cy = horizontal ? 10 : [9, 16, 23][at];
  // the lever's shaft leans from the slot's centre towards the tip (hidden when it's straight)
  const shaft = at === 1 ? '' : '<path d="M'+(W/2)+' '+(H/2)+' L'+cx+' '+cy+'" stroke="#3c3c3c" stroke-width="3" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><rect '+slot+' fill="#070707" stroke="#6e6e6e" stroke-width="1.2"/>'
    + shaft+'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#e2e2e2" stroke="#7a7a7a" stroke-width="1"/><circle cx="'+(cx - 1)+'" cy="'+(cy - 1)+'" r="1.4" fill="#fafafa"/></svg>';
}
function togSVG(t){ return leverSVG(t.pos, false); }
function togHSVG(pos){ return leverSVG(pos, true); }
function targetAttrs(t){ return t.channel ? 'data-target="channel"' : 'data-target="ctrl" data-key="'+t.key+'" data-ch="'+chAttr(t.ch)+'"'; }
function targetId(t){ return t.channel ? 'channel' : t.key+'-'+chAttr(t.ch); }
function jpToggle(x, y, options, current, target, aria, labelPos, title, titleY){
  const idx = Math.max(0, options.findIndex(o => o.v === current));
  let h = '<div class="pos" style="left:'+x+'px;top:'+y+'px"><button class="togbtn" tabindex="-1" aria-hidden="true" data-act="cycle" '+targetAttrs(target)+'>'+togSVG(tip(posFor(idx, options.length)))+'</button></div>';
  options.forEach((o, i) => {
    h += '<button id="t-'+targetId(target)+'-'+i+'" class="tlbl pos" style="left:'+labelPos[i].x+'px;top:'+labelPos[i].y+'px" aria-pressed="'+(o.v === current)+'"'
      + ' aria-label="'+esc(aria+': '+o.label)+'" data-act="pick" '+targetAttrs(target)+' data-v="'+jattr(o.v)+'">'+esc(o.label)+'</button>';
  });
  if (title) h += '<span class="silk pos" style="left:'+x+'px;top:'+titleY+'px">'+esc(title)+'</span>';
  return h;
}
function faderInput(c, n, value, prefix){
  return '<input id="f-'+c.key+'-'+chAttr(n)+'" class="sr fader-in" type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+value+'"'
    + ' aria-label="'+esc(prefix+c.label)+'" aria-valuetext="'+f1(value)+' of '+c.max+(value === (c.min + c.max)/2 ? ', center' : '')+'"'
    + ' data-ctrl="'+c.key+'" data-ch="'+chAttr(n)+'">';
}
// Xotic Effects BB Preamp: the red pedal's control area with a thin margin (the LED, bypass footswitch,
// jacks and the lower body are left out). Four white seven-lobed knobs in a 2 × 2 grid — GAIN · TREBLE
// over VOLUME · BASS — each with its black pointer line and the printed dot that marks the start of its
// travel; light-pink labels under the knobs and the name in plain text where the pedal prints it.
const BB_POS = { gain:[60, 52], treble:[168, 52], volume:[60, 140], bass:[168, 140] };
const BB_CAP = (function(){
  const N = 140, lobes = 7, R = 30, depth = 2.6; let d = '';
  for (let i = 0; i <= N; i++) { const a = i/N*2*Math.PI, r = R - depth*(0.5 - 0.5*Math.cos(lobes*a)); d += (i ? 'L' : 'M')+(34 + r*Math.sin(a)).toFixed(2)+' '+(34 - r*Math.cos(a)).toFixed(2); }
  return d + 'Z';
})();
const BB_DOT = (function(){ const a = -150*Math.PI/180; return '<circle cx="'+(34 + 33*Math.sin(a)).toFixed(1)+'" cy="'+(34 - 33*Math.cos(a)).toFixed(1)+'" r="2.2" fill="#140e0e"/>'; })();
function bbKnobHTML(c, v, s){
  // compact: knobs and case shrink, but the rows keep room for the full-size labels
  const x = BB_POS[c.key][0]*s, y = s < 1 ? (BB_POS[c.key][1] < 100 ? 36 : 116) : BB_POS[c.key][1], k = Math.round(68*s), angle = (-150 + (v - c.min)/(c.max - c.min)*300).toFixed(1);
  return '<div class="bbk" style="left:'+x+'px;top:'+y+'px;width:'+k+'px;height:'+k+'px"><label class="kctl" style="width:'+k+'px;height:'+k+'px"><input id="k-'+c.key+'-" class="sr knob-in" type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+v+'"'
    + ' aria-label="'+esc(nice(c.label))+'" aria-valuetext="'+f1(v)+' of '+c.max+'" data-ctrl="'+c.key+'" data-ch="">'
    + '<span class="kwrap" style="width:'+k+'px;height:'+k+'px" data-drag="knob" data-ctrl="'+c.key+'" data-ch=""><svg viewBox="0 0 68 68" width="'+k+'" height="'+k+'" aria-hidden="true">'+BB_DOT
    + '<g transform="rotate('+angle+' 34 34)"><path d="'+BB_CAP+'" fill="#f7f7f5" stroke="#c9c4c0" stroke-width="1"/><circle cx="34" cy="34" r="21" fill="none" stroke="#e4e0dc" stroke-width="1"/>'
    + '<path d="M34 13 L34 26" stroke="#141414" stroke-width="3.6" stroke-linecap="round"/></g></svg></span></label><span class="ro" aria-hidden="true">'+f1(v)+'</span></div>'
    + '<span class="bblab" style="left:'+x+'px;top:'+(y + (s < 1 ? 38 : 44))+'px">'+esc(nice(c.label))+'</span>';
}
// s scales the knobs and the case (a pedal drawn in front of other gear is smaller); text keeps its size
function bbPanelHTML(def, as, s = 1){
  const g = as.global, C = (k) => def.controls.find(c => c.key === k);
  let h = '<div class="bbface'+(s < 1 ? ' compact' : '')+'" style="width:'+Math.round(228*s)+'px;height:'+(s < 1 ? 212 : 236)+'px" role="group" aria-label="'+esc(def.brand+' '+def.model+' controls')+'"><span class="bbline" aria-hidden="true"></span>';
  ['gain', 'treble', 'volume', 'bass'].forEach(k => { if (C(k)) h += bbKnobHTML(C(k), g[k], s); });
  return h + '<span class="bbname" style="left:'+Math.round(114*s)+'px;top:'+(s < 1 ? 186 : 208)+'px" aria-hidden="true">BB<span>-preamp</span></span></div>';
}

const C = (k) => def.controls.find(c => c.key === k);
function set(key, v){ if (key === '@channel') as.channel = v; else as.global[key] = v; draw(); }
function draw(){
  const f = document.activeElement && document.activeElement.id;
  document.getElementById('panel').innerHTML = '<div class="cab bbcab">'+bbPanelHTML(def, as)+'</div>';
  if (f && document.getElementById(f)) document.getElementById(f).focus({preventScroll:true});
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'channel') set('@channel', Number(t.dataset.n));
  else if (t.dataset.act === 'pick') set(t.dataset.key, JSON.parse(t.dataset.v));
  else if (t.dataset.act === 'cycle' && t.dataset.target === 'channel') { const ns = def.channels.map(c => c.n); set('@channel', ns[(ns.indexOf(as.channel) + 1) % ns.length]); }
  else if (t.dataset.act === 'cycle') { const c = C(t.dataset.key), i = c.options.findIndex(o => o.v === as.global[c.key]); set(c.key, c.options[(i + 1) % c.options.length].v); }
});
document.addEventListener('input', e => { const t = e.target; if (t.matches('input[type=range][data-ctrl]')) set(t.dataset.ctrl, snap(C(t.dataset.ctrl), parseFloat(t.value))); });
let drag = null;
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-drag]'); if (!t) return; e.preventDefault(); drag = {c:C(t.dataset.ctrl), y:e.clientY, v:as.global[t.dataset.ctrl]}; });
window.addEventListener('pointermove', e => { if (!drag) return; const c = drag.c, nv = snap(c, drag.v + (drag.y - e.clientY)/14 * (c.max - c.min)/10); if (nv !== as.global[c.key]) set(c.key, nv); });
window.addEventListener('pointerup', () => { drag = null; });
draw();
</script>
