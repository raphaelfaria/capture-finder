# Checks for pull requests and branches: types, lint, unit/component tests, the build, the end-to-end
# tests, the original test suites against the new app, and the visual parity with the pre-refactor app.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs the same checks in the deploy workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the runner's Google Chrome drives the browser tests (no browser download)
      - run: npx playwright test
      - run: npm run test:legacy:new
      - name: Visual parity with the pre-refactor app
        run: npx tsx tests/visual/parity.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-results/
            tests/visual/output/
          if-no-files-found: ignore
